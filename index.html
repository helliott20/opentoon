<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenToon Studio</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/opentoon-mark-small.svg">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="menubar"></div>

<div id="workspace">
  <div id="toolbar"></div>

  <div id="stage">
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>
      <div id="lasso-toolbar" class="lasso-tb hidden">
        <button data-mode="uniform" class="active" title="Uniform: scale + rotate, aspect preserved (default — drag inside to translate)">Uniform</button>
        <button data-mode="freeform" title="Freeform: scale X/Y independently + rotate">Freeform</button>
        <button data-mode="distort" title="Distort: drag corners for perspective">Distort</button>
        <button data-mode="warp" title="Warp: curve the edges">Warp</button>
        <span class="lasso-tb-sep"></span>
        <button data-mode="reset" title="Reset transform (clear keyframes)">Reset</button>
        <span class="lasso-tb-sep"></span>
        <button data-mode="commit" title="Commit (Enter)">✓</button>
        <button data-mode="cancel" title="Cancel (Esc)">✕</button>
      </div>
    </div>
    <div id="viewbar"></div>
  </div>

  <div id="sidebar-resizer" title="Drag to resize the panels"></div>

  <div id="sidebar">
    <div id="colorpanel" class="panel"></div>
    <div id="toolopts" class="panel"></div>
    <div id="layerpanel" class="panel"></div>
  </div>
</div>

<div id="timeline"></div>
<div id="statusbar"></div>

<div id="modal-root"></div>

<script src="src/core.js"></script>
<script src="src/palette.js"></script>
<script src="src/gif.js"></script>
<script src="src/vector.js"></script>
<script src="src/canvas.js"></script>
<script src="src/tools.js"></script>
<script src="src/timeline.js"></script>
<script src="src/playback.js"></script>
<script src="src/io.js"></script>
<script src="src/ui.js"></script>
<script src="src/launcher.js"></script>
<script src="src/pencast.js"></script>
<script src="src/main.js"></script>
</body>
</html>

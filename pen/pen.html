<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenToon — Drawing Window</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#0c0d10;color:#cdd2d9;
    font:12px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }
  /* ---- toolbar ---- */
  #bar{
    height:48px;flex:0 0 48px;
    background:#1f2228;border-bottom:1px solid #060708;
    display:flex;align-items:center;gap:4px;padding:0 8px;
  }
  .pbtn{
    width:36px;height:34px;border-radius:6px;
    background:#272b32;border:1px solid #00000055;color:#7d838f;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background-color .12s ease,color .12s ease,border-color .12s ease;
  }
  .pbtn:hover{background:#343942;color:#cdd2d9;}
  .pbtn:active{transform:translateY(1px);}
  .pbtn.active{
    background:linear-gradient(180deg,#4a9fd4,#3a86ba);color:#fff;
    border-color:#0009;box-shadow:inset 0 1px 0 #ffffff38;
  }
  .pbtn svg{width:21px;height:21px;}
  .pbtn .glyph{font-size:17px;line-height:1;font-weight:700;}
  .pbtn.pzoom{
    width:auto;min-width:54px;padding:0 8px;font-size:12px;font-weight:600;
    color:#cdd2d9;font-variant-numeric:tabular-nums;
  }
  .psep{width:1px;height:26px;background:#060708;margin:0 4px;}
  .pspacer{flex:1;}
  .pframe{
    min-width:60px;text-align:center;color:#9aa0ab;
    font-variant-numeric:tabular-nums;font-size:11px;
  }
  .pcolor{
    width:34px;height:34px;border-radius:6px;cursor:pointer;
    border:2px solid #00000066;box-shadow:0 0 0 1px #ffffff1f inset;
    position:relative;overflow:hidden;flex:0 0 auto;
  }
  .pcolor input{
    position:absolute;inset:-6px;width:200%;height:200%;
    border:none;padding:0;cursor:pointer;opacity:0;
  }
  /* ---- canvas ---- */
  #stage{flex:1;position:relative;min-height:0;}
  /* D1 slave-renderer: #screen is the only canvas now. Vector layers are
     re-rendered locally each tick from the mirrored OT.Layer/OT.Cel state
     plus a wet stroke fed from local pointer input. No bitmap channel. */
  #screen{position:absolute;top:0;left:0;touch-action:none;display:block;}
  #hint{
    position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:8px;
    color:#5d636e;text-align:center;padding:24px;pointer-events:none;
  }
  #hint .big{
    font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
    font-weight:700;font-size:18px;color:#7d838f;letter-spacing:-.01em;
  }
  /* ---- Selection chip (mirrors main window's .ca-chip exactly) ----
     The chip sits inside #bar and IS the Transform action: click to arm
     (or commit while armed). Hover raises a popover beneath it with the
     Reset button when the selection already carries a transform. */
  .ca-chip{
    position:relative;
    display:flex;align-items:stretch;
    height:22px;
    background:linear-gradient(180deg,#222831 0%,#1a1d23 100%);
    border:1px solid #00000088;border-radius:99px;
    box-shadow:
      inset 0 1px 0 #ffffff12,
      inset 0 0 0 1px #4ba8e012,
      0 1px 0 #0006,
      0 0 0 1px transparent;
    color:#cdd2d9;font-size:11px;
    cursor:pointer;outline:none;user-select:none;
    transition:transform .13s ease, box-shadow .13s ease, border-color .13s ease;
  }
  .ca-chip.hidden{display:none;}
  .ca-chip:hover,.ca-chip:focus-visible{
    transform:translateY(-1px);border-color:#000a;
    box-shadow:
      inset 0 1px 0 #ffffff18,
      inset 0 0 0 1px #4ba8e028,
      0 2px 0 #0008,
      0 6px 14px #0008,
      0 0 0 1px #4ba8e033;
  }
  .ca-chip:active{transform:translateY(0);box-shadow:inset 0 1px 2px #0008;}
  .ca-chip.is-active{
    background:linear-gradient(180deg,#4ba8e0 0%,#2f7fb8 100%) !important;
    border:1px solid #ffffffaa !important;color:#fff !important;
    box-shadow:
      inset 0 1px 0 #ffffff60,
      0 0 0 3px #4ba8e0aa,
      0 0 24px #4ba8e0,
      0 4px 16px #0009 !important;
    transform:translateY(-1px) scale(1.03) !important;
  }
  .ca-chip.is-active::after{
    content:"";position:absolute;left:-3px;top:50%;
    width:6px;height:6px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 2px #4ba8e0,0 0 8px #fff;
    transform:translateY(-50%);
    animation:caLiveDot 1.1s ease-in-out infinite;
  }
  .ca-chip.is-active .ca-dot,
  .ca-chip.is-active .ca-dot-stack .ca-dot{
    background:#fff !important;
    box-shadow:0 0 0 1px #1c5d8e,inset 0 1px 0 #ffffff60;
  }
  .ca-chip.is-active .ca-cta{background:transparent;color:#fff;}
  .ca-chip.is-active .ca-cta-icon svg{transform:rotate(45deg);stroke:#fff;}
  .ca-chip.is-active .ca-kbd{
    color:#fff;border-color:#ffffff60;background:#ffffff20;
  }
  .ca-chip.is-active:hover{
    background:linear-gradient(180deg,#5fb4e6 0%,#3989c0 100%);
    box-shadow:
      inset 0 1px 0 #ffffff50,
      0 3px 0 #0008,
      0 10px 26px #4ba8e080,
      0 0 0 2px #4ba8e050;
  }
  @keyframes caLiveDot{
    0%,100%{opacity:1;transform:translateY(-50%) scale(1);}
    50%{opacity:0.5;transform:translateY(-50%) scale(1.4);}
  }
  .ca-chip::before{
    content:"";position:absolute;left:-12px;right:-12px;top:-6px;bottom:-20px;
  }
  .ca-chip > .ca-dot,
  .ca-chip > .ca-dot-stack{margin:0 0 0 10px;align-self:center;}
  .ca-chip .ca-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    box-shadow:0 0 0 1px #0008,inset 0 1px 0 #ffffff20;
  }
  .ca-chip .ca-dot.ca-dot-group{
    border-radius:2px;
    box-shadow:0 0 0 1px #0008,inset 0 1px 0 #ffffff20,2px 2px 0 -1px #4ba8e055;
  }
  .ca-chip .ca-dot-stack{display:inline-flex;align-items:center;}
  .ca-chip .ca-dot-stack .ca-dot{margin-left:-3px;}
  .ca-chip .ca-dot-stack .ca-dot:first-child{margin-left:0;}
  .ca-chip .ca-cta{
    display:flex;align-items:center;gap:6px;padding:0 12px 0 10px;
    background:linear-gradient(180deg,#4ba8e024 0%,#4ba8e010 100%);
    color:#4ba8e0;
    font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10px;
    border-top-right-radius:99px;border-bottom-right-radius:99px;
    position:relative;margin-left:8px;
  }
  .ca-chip > .ca-cta:first-child{margin-left:0;border-radius:99px;padding-left:12px;}
  .ca-chip:hover .ca-cta,
  .ca-chip:focus-visible .ca-cta{
    background:linear-gradient(180deg,#4ba8e040 0%,#4ba8e020 100%);
    color:#cce8fa;
  }
  .ca-chip .ca-cta-icon{display:inline-flex;align-items:center;}
  .ca-chip .ca-cta-icon svg{
    width:13px;height:13px;
    transition:transform .25s cubic-bezier(.2,.85,.3,1);
  }
  .ca-chip:hover .ca-cta-icon svg,
  .ca-chip:focus-visible .ca-cta-icon svg{transform:rotate(45deg);}
  .ca-chip .ca-kbd{
    font-family:"JetBrains Mono",monospace;
    font-size:9.5px;color:#7d838f;
    background:#0009;border:1px solid #00000080;border-radius:3px;
    padding:1px 4px;margin-left:1px;font-weight:400;
  }
  .ca-chip:hover .ca-kbd,
  .ca-chip:focus-visible .ca-kbd{color:#4ba8e0;border-color:#4ba8e055;}
  .ca-chip .ca-popover{
    position:absolute;left:50%;top:calc(100% + 9px);
    transform:translate(-50%,-6px);
    display:flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#262a32f5 0%,#1c1f25f5 100%);
    border:1px solid #08090c;border-radius:99px;
    padding:5px 7px;color:#cdd2d9;
    box-shadow:0 10px 26px #000b,0 2px 6px #0008,inset 0 1px 0 #ffffff0d;
    z-index:6;opacity:0;pointer-events:none;
    transition:opacity .14s ease, transform .2s cubic-bezier(.18,.9,.26,1.1);
    backdrop-filter:blur(6px);
  }
  .ca-chip:hover .ca-popover,
  .ca-chip:focus-within .ca-popover,
  .ca-chip.open .ca-popover{
    opacity:1;transform:translate(-50%,0);pointer-events:auto;
  }
  .ca-chip .ca-popover::after{
    content:"";position:absolute;left:50%;top:-5px;
    width:8px;height:8px;background:#262a32;
    border-left:1px solid #08090c;border-top:1px solid #08090c;
    transform:translateX(-50%) rotate(45deg);
  }
  .ca-chip .ca-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:transparent;border:1px solid transparent;color:#cdd2d9;
    padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;
    transition:background-color .12s ease,color .12s ease;
  }
  .ca-chip .ca-btn svg{width:14px;height:14px;}
  .ca-chip .ca-btn:hover{background:#ffffff10;color:#f7f1e5;}
  .ca-chip .ca-reset:hover{color:#dd5038;}

  /* ---- Lasso transform toolbar (mirrors main window's #lasso-toolbar) ---- */
  #penLassoTb{
    position:absolute;left:50%;top:60px;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;padding:5px 7px;
    background:linear-gradient(180deg,#262a32f2 0%,#1c1f25f2 100%);
    border:1px solid #08090c;border-radius:999px;
    box-shadow:0 10px 26px #000c,0 2px 6px #0008,inset 0 1px 0 #ffffff0d;
    backdrop-filter:blur(6px);
    z-index:7;color:#cdd2d9;
    transition:opacity .14s ease, transform .2s cubic-bezier(.18,.9,.26,1.1);
  }
  #penLassoTb.hidden{display:none;}
  #penLassoTb button{
    background:transparent;border:1px solid transparent;
    color:#cdd2d9;font:600 11.5px/1 "Space Grotesk","Segoe UI",system-ui,sans-serif;
    padding:6px 12px;border-radius:99px;cursor:pointer;
    transition:background-color .12s ease,color .12s ease,border-color .12s ease;
  }
  #penLassoTb button:hover{background:#ffffff10;color:#f7f1e5;}
  #penLassoTb button.active{
    background:#4ba8e0;color:#fff;border-color:#0008;
    box-shadow:0 1px 0 #ffffff20 inset, 0 1px 3px #0007;
  }
  #penLassoTb button.disabled{opacity:.4;pointer-events:none;}
  #penLassoTb .pen-lasso-sep{width:1px;height:18px;background:#ffffff14;margin:0 4px;}
  #penLassoTb .pen-lasso-commit{color:#54b06a;font-size:14px;padding:4px 12px;}
  #penLassoTb .pen-lasso-commit:hover{background:#54b06a22;color:#7cd394;}
  #penLassoTb .pen-lasso-cancel{color:#dd5038;font-size:13px;padding:4px 12px;}
  #penLassoTb .pen-lasso-cancel:hover{background:#dd503822;color:#f17a64;}
</style>
</head>
<body>
  <div id="bar"></div>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="penLassoTb" class="hidden"></div>
    <div id="hint">
      <div class="big">OpenToon Drawing Window</div>
      <div>Waiting for the main window… draw here once the canvas appears.</div>
    </div>
  </div>
  <!-- D1 slave renderer: pen window mirrors OT.Layer/OT.Cel from core.js
       and runs the shared OT.compositeStage so it renders identically to
       the main canvas. core.js declares OT.util internally; no separate
       util.js is needed. -->
  <script src="../src/core.js"></script>
  <script src="../src/vector.js"></script>
  <script src="../src/composite.js"></script>
  <script src="pen.js"></script>
</body>
</html>
